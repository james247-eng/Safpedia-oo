<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Marketplace Orders | SAFpedia</title>
    <link rel="stylesheet" href="css/ui-foundation.css">
    <link rel="stylesheet" href="css/student-dashboard.css">
    <link rel="stylesheet" href="css/nav-core.css">
    <link rel="stylesheet" href="css/marketplace-orders.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>

    <div class="mobile-topbar">
        <button class="sidebar-toggle-btn" id="sidebar-toggle-btn">
            <ion-icon name="menu-outline" class="menu-icon"></ion-icon>
            <ion-icon name="close-outline" class="close-icon"></ion-icon>
        </button>
        <div class="brand-logo">SAFpedia</div>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="dashboard-layout">
        <!-- SIDEBAR NAVIGATION PANEL — 3 top-level sections + Browse -->
        <aside class="sidebar-panel">
            <div class="brand-logo">SAFpedia</div>
            <ul class="nav-group">
                <li><a href="dashboard.html"><div class="nav-item-btn active"><ion-icon name="grid-outline"></ion-icon><span class="nav-label">Dashboard</span></div></a></li>
                <li><a href="affiliate.html"><div class="nav-item-btn"><ion-icon name="cash-outline"></ion-icon><span class="nav-label">Affiliate</span></div></a></li>
                <li><a href="sellers-page.html"><div class="nav-item-btn"><ion-icon name="storefront-outline"></ion-icon><span class="nav-label">Sell on SAFpedia</span></div></a></li>
            </ul>
            <div class="nav-section-label">Browse</div>
            <ul class="nav-group">
                <li><a href="../all-courses.html"><div class="nav-item-btn"><ion-icon name="book-outline"></ion-icon><span class="nav-label">Digital Library</span></div></a></li>
            </ul>
        </aside>

        <main class="main-workspace-view">

            <!-- DASHBOARD TOP BAR (notification + avatar) -->
            <header class="dashboard-header top-nav">
                <div class="topbar-spacer"></div>
                <div class="topbar-right" id="navbar">
                    <div class="nav-right">
                        <!-- notification-center.js mounts the bell here -->
                        <div class="user-menu">
                            <button type="button" class="user-avatar-btn" id="buyer-avatar-slot" aria-label="Account menu" aria-expanded="false">
                                U
                            </button>
                            <div class="user-dropdown" id="user-dropdown" hidden>
                                <div class="user-dropdown-email" id="buyer-display-email">Student Account</div>
                                <a href="#" id="buyer-logout-trigger" class="user-dropdown-logout">Sign Out</a>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- PAGE TAB BAR -->
            <div class="page-tab-bar">
                <a href="dashboard.html#library-pane" class="page-tab">
                    <ion-icon name="grid-outline"></ion-icon> My Courses
                </a>
                <a href="dashboard.html#history-pane" class="page-tab">
                    <ion-icon name="receipt-outline"></ion-icon> Purchase History
                </a>
                <a href="marketplace-orders.html" class="page-tab active">
                    <ion-icon name="bag-handle-outline"></ion-icon> Marketplace Orders
                </a>
            </div>

            <section class="dashboard-section-card active-tab">
                <p>Everything you've purchased from SAFpedia vendors — separate from your course purchases.</p>

                <div id="orders-list" class="data-table-frame">
                    <div class="loading-placeholder">Loading your orders...</div>
                </div>
            </section>

            <!-- DISPUTE SUBMISSION MODAL -->
            <div id="dispute-modal" class="modal-overlay hidden">
                <div class="modal-box">
                    <button type="button" id="dispute-modal-close">&times;</button>
                    <h3>Report a problem</h3>
                    <form id="dispute-form">
                        <label>Reason
                            <select id="dispute-reason" required>
                                <option value="">Select a reason</option>
                                <option value="item_not_received">Item not received</option>
                                <option value="item_not_as_described">Item not as described</option>
                                <option value="digital_access_problem">Digital access problem</option>
                                <option value="other">Other</option>
                            </select>
                        </label>
                        <label>What happened?
                            <textarea id="dispute-statement" rows="5" required></textarea>
                        </label>
                        <div id="dispute-form-message"></div>
                        <button type="submit" class="btn btn-primary">Submit dispute</button>
                    </form>
                </div>
            </div>

            <!-- DISPUTE DETAILS VIEW MODAL -->
            <div id="dispute-details-modal" class="modal-overlay hidden">
                <div class="modal-box modal-lg">
                    <button type="button" id="dispute-details-modal-close">&times;</button>
                    <div class="dispute-details-content">
                        <!-- Populated dynamically via JS -->
                    </div>
                </div>
            </div>

        </main>
    </div>
    <script type="module" src="js/marketplace-orders.js"></script>
    <script src="js/nav-core.js"></script>
    <script type="module" src="/js/chatbot/chatbot-loader.js" defer></script>
</body>
</html>
