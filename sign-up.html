<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Safpedia</title>
  <link rel="stylesheet" href="css/auth.css" />

  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="manifest" href="favicon/site.webmanifest">
  <meta name="theme-color" content="#2954FF" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Ionicons -->
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
</head>
<body class="auth-body">

  <main class="auth-shell">

    <!-- FORM PANEL -->
    <section class="auth-form-panel">
      <div class="auth-card">

        <div class="auth-card-brand">
          <span class="mark">S</span>
          <span class="eyebrow">Safpedia Ã‚Â· Member Access</span>
        </div>

        <!-- Ã¢Â­Â ENROLLMENT CONTEXT BANNER -->
        <div id="enrollment-context" style="display:none;">
          <ion-icon name="school-outline"></ion-icon>
          <h3>Complete Your Enrollment</h3>
          <p>Create an account to enroll in your selected course</p>
        </div>

        <div class="auth-header">
          <h1>Create your account</h1>
          <p>Join Safpedia for sermons, ebooks, podcasts, and more.</p>
        </div>

        <form id="signup-form">
          <div class="name-row">
            <div class="form-group">
              <input id="firstName" type="text" placeholder=" " required />
              <label for="firstName">First name</label>
            </div>
            <div class="form-group">
              <input id="lastName" type="text" placeholder=" " required />
              <label for="lastName">Last name</label>
            </div>
          </div>
          <div class="form-group">
            <input id="email" type="email" placeholder=" " required />
            <label for="email">Email</label>
          </div>
          <div class="form-group">
            <input id="password" type="password" placeholder=" " required minlength="6" />
            <label for="password">Password (min 6 characters)</label>
          </div>
          <div class="form-group">
            <input id="phone" type="tel" placeholder=" " required />
            <label for="phone">Phone</label>
          </div>
          <div class="form-group">
            <select id="course-selection">
              <option value="">Select a course (optional)</option>
              <option value="web-design">Web Design</option>
              <option value="data-analysis">Data Analysis</option>
              <option value="video-editing">Video Editing</option>
              <option value="facebook-ads">Facebook Ads</option>
            </select>
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="terms" checked />
            <label for="terms">
              I agree to the <a href="#">Terms and Conditions</a>
            </label>
          </div>

          <div class="btn-container">
            <button id="signup-btn" type="submit">Sign Up</button>
          </div>

          <!-- Ã¢Â­Â LOGIN LINK -->
          <div class="auth-links">
            <a href="sign-in.html" id="login-link">Already have an account? Login</a>
          </div>
        </form>

        <!-- Ã¢Â­Â SOCIAL SIGN-UP -->
        <div class="auth-divider"><span>or continue with</span></div>
        <div class="social-btn-group">
          <button type="button" class="social-btn google-signin-btn">
            <ion-icon name="logo-google"></ion-icon> Google
          </button>
          <button type="button" class="social-btn facebook-signin-btn">
            <ion-icon name="logo-facebook"></ion-icon> Facebook
          </button>
        </div>

        <!-- Error/Success Messages -->
        <div id="signup-result" style="margin-top:15px; padding:12px; border-radius:8px; display:none;"></div>

        <div class="auth-card-footer">Ã‚Â© <span id="year"></span> Safpedia |Powered by Easblink NG</div>
      </div>
    </section>

  </main>

  <!-- Ã¢Â­Â MODAL CONTAINER -->
  <div id="enrollment-success-modal" style="display:none;"></div>

  <!-- Ã¢Â­Â SCRIPTS - MUST LOAD IN THIS EXACT ORDER -->
  <script type="module" src="js/toast-notification.js"></script>
  <script type="module" src="js/auth.js"></script>

  <!-- Footer Year -->
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
    <script src="js/ref-tracker.js"></script>

  <script type="module" src="/js/chatbot/chatbot-loader.js" defer></script>
</body>
</html>
