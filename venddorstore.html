<!-- vendor-store.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store | Safpedia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/marketplace.css">
    <link rel="stylesheet" href="css/vendor-store.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>

    <!-- MARKETPLACE HEADER (mirrors marketplace-store.html) -->
    <header class="marketplace-header">
        <div class="header-container">
            <a href="index.html" class="brand-logo">Safpedia</a>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="all-courses.html" class="nav-link">Browse Courses</a>
                <a href="marketplace-store.html" class="nav-link">Marketplace</a>
                <a href="sell.html" class="nav-link">Sell on Safpedia</a>
                <a href="students/dashboard.html" class="nav-link" id="student-portal-link">My Library</a>
            </nav>
            <div class="header-actions">
                <div class="user-action-area" id="auth-status-container">
                    <a href="sign-in.html" class="btn btn-primary">Sign In</a>
                </div>
                <button class="mobile-menu-btn" id="mobile-menu-btn">
                    <ion-icon name="menu-outline" class="menu-icon"></ion-icon>
                    <ion-icon name="close-outline" class="close-icon"></ion-icon>
                </button>
            </div>
        </div>
    </header>

    <main class="catalog-wrapper">
        <section class="vendor-store-banner" id="vendor-banner">
            <div class="vendor-avatar" id="vendor-avatar">V</div>
            <h1 id="vendor-store-title">Loading store...</h1>
            <p id="vendor-product-count"></p>
        </section>

        <section class="products-grid-container">
            <div id="products-grid" class="products-grid">
                <div class="loading-placeholder">Loading products...</div>
            </div>
        </section>
    </main>

    <script type="module" src="js/vendor-store.js"></script>
    <script type="module" src="js/mobile-nav.js"></script>
</body>
</html>
