<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Payment | Safpedia</title>
    <link rel="stylesheet" href="css/marketplace.css">
    <link rel="stylesheet" href="css/marketplace-payment-success.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
    <main class="payment-success-wrapper">
        <div class="payment-success-card">
            <div class="status-icon" id="status-icon"><ion-icon name="hourglass-outline"></ion-icon></div>
            <h1 id="status-title">Confirming your subscription payment...</h1>
            <p id="status-message">Hang tight while we confirm this with Paystack.</p>
            <div id="order-summary" class="order-summary hidden"></div>
            <div class="success-actions">
                <a href="users/sellers-page.html#subscription-pane" class="btn btn-primary">Go to Subscription</a>
                <a href="users/sellers-page.html" class="btn btn-secondary">Back to Seller Dashboard</a>
            </div>
            <p class="redirect-note" id="redirect-note"></p>
        </div>
    </main>
    <script type="module" src="js/subscription-payment-success.js"></script>
</body>
</html>
